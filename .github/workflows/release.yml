name: 发布 Paper to Journal Club 本地 Marketplace

on:
  # 只允许由版本标签触发，避免把开发分支误发布给终端用户。
  push:
    tags:
      - 'v*'

permissions:
  # 默认只读；写 Release 的权限在唯一的发布 job 中显式声明。
  contents: read

concurrency:
  group: paper-to-journal-club-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: windows-latest
    # 与锁文件生成流程一致：隔离托管运行器自带的其他 SDK，并服从仓库根
    # global.json 的精确 SDK 约束，保证可复现的解析器二进制构建。
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'

    steps:
      - name: 检出固定版本标签
        # actions/checkout v4.3.1，固定到完整提交 SHA，避免可变标签供应链风险。
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          # 构建代码不保留可用于 git push 的凭据；发布令牌仅出现在独立 job。
          persist-credentials: false

      - name: 安装发布者构建所需的 .NET SDK
        # actions/setup-dotnet v4.3.1，固定到完整提交 SHA。
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          # 固定 SDK 补丁版本，避免每次标签构建解析到不同的 8.0.x。
          dotnet-version: '8.0.418'
          global-json-file: global.json

      - name: 检查标签与插件版本一致
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'plugins/paper-to-journal-club/.codex-plugin/plugin.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $expectedTag = "v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git 标签 '$env:GITHUB_REF_NAME' 必须与插件版本匹配：$expectedTag"
          }

      - name: 运行无需 Office 的安装器与内容回归测试
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/install-layout-tests.ps1')
          & (Join-Path $env:GITHUB_WORKSPACE 'plugins/paper-to-journal-club/tests/content-template-tests.ps1')
          & (Join-Path $env:GITHUB_WORKSPACE 'plugins/paper-to-journal-club/tests/end-to-end-tests.ps1')

      - name: 构建随包 PDF 解析器
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'plugins/paper-to-journal-club/scripts/build-paper-parser.ps1')

      - name: 构建并离线验证 Marketplace ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'paper-to-journal-club-release'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools/Build-ReleasePackage.ps1') -OutputDirectory $outputDirectory

          $archives = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'paper-to-journal-club-marketplace-*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "构建后应恰好存在一个 Marketplace ZIP，实际为 $($archives.Count) 个。"
          }
          $archive = $archives[0]
          $packageRoots = @(Get-ChildItem -LiteralPath $outputDirectory -Directory | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName '.agents/plugins/marketplace.json') })
          if ($packageRoots.Count -ne 1) {
            throw "构建后应恰好存在一个 Marketplace 根目录，实际为 $($packageRoots.Count) 个。"
          }
          & (Join-Path $packageRoots[0].FullName 'verify-release.ps1') -MarketplaceRoot $packageRoots[0].FullName

          # 外部校验文件保护下载阶段；包内 SHA256SUMS.txt 继续保护解压后的每个运行时文件。
          $checksumPath = "$($archive.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash  *$($archive.Name)" -Encoding ascii -NoNewline

          # 将无需 Git 的引导安装器也作为 Release 资产发布，并提供独立哈希供用户先验证脚本。
          $bootstrapPath = Join-Path $outputDirectory 'paper-to-journal-club-bootstrap.ps1'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'install.ps1') -Destination $bootstrapPath
          $bootstrapChecksumPath = "$bootstrapPath.sha256"
          $bootstrapHash = (Get-FileHash -LiteralPath $bootstrapPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $bootstrapChecksumPath -Value "$bootstrapHash  *$(Split-Path -Leaf $bootstrapPath)" -Encoding ascii -NoNewline

          "archive=$($archive.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bootstrap=$bootstrapPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "bootstrap_checksum=$bootstrapChecksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 将经验证的发行资产交给最小权限发布 job
        # actions/upload-artifact v4.6.2，固定完整 SHA；只传递四个最终 Release 资产。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-to-journal-club-release-assets-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.bootstrap }}
            ${{ steps.package.outputs.bootstrap_checksum }}
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs: build-and-package
    runs-on: windows-latest
    # 只有不执行仓库源码的发布 job 获得写 Release 的权限。
    permissions:
      contents: write

    steps:
      - name: 下载经验证的发行资产
        # actions/download-artifact v4.3.0，固定完整 SHA。
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper-to-journal-club-release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/paper-to-journal-club-release-assets

      - name: 创建不可覆盖的 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'paper-to-journal-club-release-assets'
          $archives = @(Get-ChildItem -LiteralPath $assetDirectory -Filter 'paper-to-journal-club-marketplace-*.zip' -File)
          if ($archives.Count -ne 1) { throw "发布资产中应恰好有一个 Marketplace ZIP，实际为 $($archives.Count) 个。" }
          $archive = $archives[0].FullName
          $checksum = "$archive.sha256"
          $bootstrap = Join-Path $assetDirectory 'paper-to-journal-club-bootstrap.ps1'
          $bootstrapChecksum = "$bootstrap.sha256"
          foreach ($requiredAsset in @($archive, $checksum, $bootstrap, $bootstrapChecksum)) {
            if (-not (Test-Path -LiteralPath $requiredAsset -PathType Leaf)) { throw "发布资产缺失：$requiredAsset" }
          }
          if (@(Get-ChildItem -LiteralPath $assetDirectory -File).Count -ne 4) { throw '发布 job 只接受四个预期的 Release 资产。' }

          # 标签一旦已有 Release 就让工作流失败，不覆写资产或哈希文件。
          # 修复发行版应使用新的版本号和新标签，避免把同一标签悄悄指向不同二进制。
          & gh release create $tag $archive $checksum $bootstrap $bootstrapChecksum --title "Paper to Journal Club $tag" --generate-notes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release '$tag' 发布失败，退出码为 $LASTEXITCODE。"
          }
