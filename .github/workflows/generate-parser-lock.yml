name: 生成 Paper Parser NuGet 锁文件

on:
  # 只由维护者手动运行；工作流不会提交或推送依赖锁。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: windows-latest
    # GitHub 托管运行器可能预装比本项目更新的 SDK。禁用多级查找并结合仓库根
    # global.json，确保脚本不会悄悄解析到 .NET 10 等未审阅 SDK。
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      # actions/checkout v4.3.1：固定到完整提交 SHA，且不保留 Git 写入凭据。
      - name: 检出待审阅源码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      # actions/setup-dotnet v4.3.1：与正式 Release 使用同一固定 SDK。
      - name: 安装固定 .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.418'
          global-json-file: global.json

      - name: 生成并验证锁文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Generate-ParserPackageLock.ps1 -Force

      # actions/upload-artifact v4.6.2：只导出锁文件，维护者审阅后手工提交。
      - name: 上传待审阅锁文件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-parser-packages-lock-${{ github.run_id }}
          path: plugins/paper-to-journal-club/parser/packages.lock.json
          if-no-files-found: error
          retention-days: 7
